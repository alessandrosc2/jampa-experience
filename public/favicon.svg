<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="48" fill="#060B11" stroke="#00B4D8" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" stroke="rgba(244,162,97,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Sun & Sunset Glow -->
  <circle cx="50" cy="42" r="14" fill="url(#sunGrad)"/>
  <!-- Waves / Coast -->
