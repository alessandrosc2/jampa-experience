  <polygon points="50,18 55,36 50,32 45,36" fill="#F4A261"/>
  <defs>
    <linearGradient id="sunGrad" x1="50" y1="28" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A261"/>
      <stop offset="1" stop-color="#E76F51"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="15" y1="55" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#0077B6"/>
