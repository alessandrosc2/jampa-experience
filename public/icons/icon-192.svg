      <stop offset="0%" stop-color="#0B131E"/>
      <stop offset="50%" stop-color="#060B11"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
